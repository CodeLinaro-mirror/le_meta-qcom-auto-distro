BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes-*/*.bb \
"

BBFILE_COLLECTIONS += "qcom-auto-distro"
BBFILE_PATTERN_qcom-auto-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_qcom-auto-distro = "18"
LAYERSERIES_COMPAT_qcom-auto-distro = "kirkstone scarthgap"
QTI_METAPATH_DISTRO := '${@os.path.normpath("${LAYERDIR}/")}'

